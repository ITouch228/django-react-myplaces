name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy .
      - name: Django checks
        run: python manage.py check
      - name: Ensure migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Tests with coverage
        run: |
          coverage run manage.py test
          coverage report
          coverage xml -o coverage.xml
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend / lint, build, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies from lockfile
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript and production build
        run: npm run build
      - name: Unit tests
        run: npm run test -- --run --passWithNoTests

  docs:
    name: Documentation / MkDocs strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install docs dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Validate MkDocs
        run: python -m mkdocs build --strict
      - name: Build and smoke docs image
        run: |
          docker build -f docs/Dockerfile -t myplaces-docs:ci .
          docker run -d --rm --name myplaces-docs-ci -p 127.0.0.1:18093:80 myplaces-docs:ci
          trap 'docker stop myplaces-docs-ci' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18093/ -o /tmp/myplaces-docs.html; then break; fi
            sleep 1
          done
          test -s /tmp/myplaces-docs.html
          grep -q 'MyPlaces' /tmp/myplaces-docs.html
      - name: Build shared Jenkins agent image
        run: |
          docker build -f ci/jenkins/agent/Dockerfile -t myplaces-jenkins-agent:ci .
          docker run --rm --entrypoint /bin/sh myplaces-jenkins-agent:ci -c "python3.12 --version && node --version && npm --version"
      - name: Validate Docker Compose
        run: |
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env
          docker compose config --quiet
