site_name: MyPlaces
site_description: Личная карта мест, чеки и оценки блюд
repo_url: https://github.com/ITouch228/django-react-myplaces
repo_name: ITouch228/django-react-myplaces
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true
theme:
  name: material
  language: ru
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
plugins:
  - search:
      lang:
        - ru
        - en
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
validation:
  nav:
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
nav:
  - Главная: index.md
  - Пользователю:
      - Запуск приложения: getting-started.md
      - Работа с местами и чеками: user-guide.md
  - Архитектура:
      - Устройство системы: architecture.md
      - HTTP API: api.md
  - Разработчику:
      - Тестирование: testing.md
      - Единый Jenkins: jenkins.md
      - Процесс разработки: contributing.md
  - Дорожная карта: roadmap.md
