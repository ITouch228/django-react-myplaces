services:
  backend:
    build:
      context: ./backend
      target: dev
    container_name: my_places-backend
    ports:
      - "127.0.0.1:8072:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    networks:
      - network

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: my_places-frontend
    ports:
      - "127.0.0.1:8071:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - network

  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
    container_name: my_places-docs
    restart: unless-stopped
    ports:
      - "127.0.0.1:8093:80"

networks:
  network:
    driver: bridge
