services:
  backend:
    build:
      context: ./backend
      target: dev
    container_name: my_places-backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    networks:
      - network

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: my_places-frontend
    ports:
      - "8071:8071"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - network

networks:
  network:
    driver: bridge